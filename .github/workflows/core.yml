name: Core Tests
on:
  push:
    branches: ['*']
    paths:
      - pyproject.toml
      - .github/**
      - devscripts/**
      - test/**
      - yt_dlp/**.py
      - '!yt_dlp/extractor/**.py'
      - yt_dlp/extractor/youtube/**.py
      - yt_dlp/extractor/__init__.py
      - yt_dlp/extractor/common.py
      - yt_dlp/extractor/extractors.py
  pull_request:
    branches: ['**']
    paths:
      - pyproject.toml
      - .github/**
      - devscripts/**
      - test/**
      - yt_dlp/**.py
      - '!yt_dlp/extractor/**.py'
      - yt_dlp/extractor/youtube/**.py
      - yt_dlp/extractor/__init__.py
      - yt_dlp/extractor/common.py
      - yt_dlp/extractor/extractors.py

permissions: {}

concurrency:
  group: core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Core tests
    if: ${{ !contains(github.event.head_commit.message, ':ci skip') }}
    permissions:
      contents: read
    runs-on: windows-latest
    
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Set up Python pypi-3.11
      uses: actions/setup-python@6.2.0
      with:
        python-version: pypi-3.11
        allow-prereleases: true

    - name: Install test requirements (PyPy)
      run: |
        python -m pip install -U --require-hashes -r "bundle/requirements/pip.txt"
        python -m pip install -U --require-hashes -r "bundle/requirements/test.txt"
        python -m pip install -U --require-hashes -r "bundle/requirements/default.txt"

    - name: Run tests
      timeout-minutes: 15
      continue-on-error: False
      env:
        source: ${{ (github.event_name == 'push' && github.event.before) || 'origin/master' }}
        target: ${{ (github.event_name == 'push' && github.event.after) || 'HEAD' }}
      shell: bash
      run: |
        flags=()
        # Check if a networking file is involved
        patterns="\
        ^yt_dlp/networking/
        ^yt_dlp/utils/networking\.py$
        ^test/test_http_proxy\.py$
        ^test/test_networking\.py$
        ^test/test_networking_utils\.py$
        ^test/test_socks\.py$
        ^test/test_websockets\.py$
        ^pyproject\.toml$
        "
        if git diff --name-only "${source}" "${target}" | grep -Ef <(printf '%s' "${patterns}"); then
          flags+=(--flaky)
        fi
        python3 -m yt_dlp -v || true  # Print debug head
        python3 -m devscripts.run_tests "${flags[@]}" --pytest-args '--reruns 2 --reruns-delay 3.0' core
