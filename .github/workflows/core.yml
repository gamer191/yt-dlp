name: Core Tests
on: push

jobs:
  tests:
    name: Core tests
    runs-on: windows-latest
    
    steps:
    - uses: actions/setup-python@v6.2.0
      with:
        python-version: pypy-3.11
        allow-prereleases: true

    - name: Install test requirements (PyPy)
      run: |
        python -m pip install -U pip
        python -m pip install -U yt-dlp
        
